name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shortpilot_test
          POSTGRES_USER: shortpilot
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shortpilot -d shortpilot_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      API_ENVIRONMENT: test
      API_DATABASE_URL: postgresql+psycopg://shortpilot:test-password@localhost:5432/shortpilot_test
      API_JWT_SECRET: ci-only-secret-with-at-least-32-characters
      POSTGRES_PASSWORD: compose-validation-only
      REDIS_PASSWORD: compose-validation-only
      REDIS_URL: redis://:compose-validation-only@redis:6379/0
      APP_DOMAIN: app.example.test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install CI dependencies
        run: pip install -r requirements-ci.txt
      - name: Unit tests
        run: python -B -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m compileall -q api billing bot core db scheduler tests
      - name: PostgreSQL migrations
        run: alembic upgrade head
      - name: Create non-secret Compose env file
        run: |
          printf '%s\n' \
            'POSTGRES_DB=shortpilot_test' \
            'POSTGRES_USER=shortpilot' \
            'POSTGRES_PASSWORD=compose-validation-only' \
            'API_DATABASE_URL=postgresql+psycopg://shortpilot:compose-validation-only@postgres:5432/shortpilot_test' \
            'REDIS_PASSWORD=compose-validation-only' \
            'REDIS_URL=redis://:compose-validation-only@redis:6379/0' \
            'APP_DOMAIN=app.example.test' \
            'API_ENVIRONMENT=test' \
            'API_JWT_SECRET=ci-only-secret-with-at-least-32-characters' \
            > .env
      - name: Validate Compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet

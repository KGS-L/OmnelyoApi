name: Deploy production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit, tag ou branche à déployer"
        required: true
        default: main

permissions:
  contents: read

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      - name: Deploy selected revision
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PROJECT_PATH: ${{ secrets.VPS_PROJECT_PATH }}
          DEPLOY_REF: ${{ inputs.ref }}
        run: |
          ssh -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" bash -s -- "$VPS_PROJECT_PATH" "$DEPLOY_REF" <<'REMOTE'
          set -euo pipefail
          project_path="$1"
          deploy_ref="$2"
          cd "$project_path"
          git fetch --prune --tags origin
          if git rev-parse --verify "origin/$deploy_ref^{commit}" >/dev/null 2>&1; then
            target="origin/$deploy_ref"
          else
            target="$deploy_ref"
          fi
          git checkout --detach "$target"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml build
          docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --remove-orphans
          docker compose -f docker-compose.yml -f docker-compose.prod.yml ps
          REMOTE

name: Deploy backend staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - name: Resolve source revision
        id: source
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image_name="${OWNER,,}/omnelyo-backend"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${image_name}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v5

      - name: Prepare verified SSH access
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Upload deployment manifests
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_BACKEND_PATH: ${{ secrets.VPS_BACKEND_PATH }}
        run: |
          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            "install -d -m 750 '$VPS_BACKEND_PATH' '$VPS_BACKEND_PATH/scripts'"
          scp -P "$VPS_PORT" -i ~/.ssh/deploy_key \
            docker-compose.yml docker-compose.prod.yml .env.production.example \
            "$VPS_USER@$VPS_HOST:$VPS_BACKEND_PATH/"
          scp -P "$VPS_PORT" -i ~/.ssh/deploy_key \
            scripts/bootstrap-vps-env.sh \
            "$VPS_USER@$VPS_HOST:$VPS_BACKEND_PATH/scripts/"

      - name: Deploy immutable image and verify health
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_BACKEND_PATH: ${{ secrets.VPS_BACKEND_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TARGET_IMAGE: ${{ needs.publish.outputs.image }}
          HEALTHCHECK_URL: https://api-omnelyo.kgslab.com/health
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key \
            "$VPS_USER@$VPS_HOST" \
            "docker login ghcr.io -u '$GHCR_USERNAME' --password-stdin"

          ssh -p "$VPS_PORT" -i ~/.ssh/deploy_key "$VPS_USER@$VPS_HOST" \
            bash -s -- "$VPS_BACKEND_PATH" "$TARGET_IMAGE" "$HEALTHCHECK_URL" <<'REMOTE'
          set -Eeuo pipefail
          project_path="$1"
          target_image="$2"
          healthcheck_url="$3"
          cd "$project_path"

          bash scripts/bootstrap-vps-env.sh .env.production.example .env
          compose=(docker compose -f docker-compose.yml -f docker-compose.prod.yml)
          state_file=.deployed-backend-image
          previous_image=""
          if [[ -f "$state_file" ]]; then
            previous_image="$(tr -d '\r\n' < "$state_file")"
          fi

          rollback() {
            trap - ERR
            if [[ -n "$previous_image" && "$previous_image" != "$target_image" ]]; then
              echo "Healthcheck en échec, retour à l'image précédente."
              BACKEND_IMAGE="$previous_image" "${compose[@]}" up -d --no-build --remove-orphans api worker shortpilot-bot
            fi
          }
          trap rollback ERR

          BACKEND_IMAGE="$target_image" "${compose[@]}" pull api migrate worker shortpilot-bot
          BACKEND_IMAGE="$target_image" "${compose[@]}" run --rm migrate
          BACKEND_IMAGE="$target_image" "${compose[@]}" up -d --no-build --remove-orphans postgres redis api worker shortpilot-bot

          healthy=false
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 "$healthcheck_url" >/dev/null; then
              healthy=true
              break
            fi
            sleep 3
          done
          [[ "$healthy" == true ]]

          printf '%s\n' "$target_image" > "$state_file"
          trap - ERR
          "${compose[@]}" ps
          docker image prune -f --filter "until=168h"
          REMOTE

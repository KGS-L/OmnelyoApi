name: Deploy backend staging

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: backend-staging
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      image: ${{ steps.image.outputs.ref }}
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Resolve source revision
        id: source
        env:
          WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          source_sha="${WORKFLOW_RUN_SHA:-$GITHUB_SHA}"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.source.outputs.sha }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable image name
        id: image
        env:
          OWNER: ${{ github.repository_owner }}
          SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          image_name="${OWNER,,}/omnelyo-backend"
          echo "name=$image_name" >> "$GITHUB_OUTPUT"
          echo "ref=${REGISTRY}/${image_name}:${SOURCE_SHA}" >> "$GITHUB_OUTPUT"

      - name: Build and publish backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.ref }}
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:staging-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    needs: publish
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    environment: staging
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.publish.outputs.source_sha }}

      - name: Install deployment manifests locally
        env:
          VPS_BACKEND_PATH: ${{ secrets.VPS_BACKEND_PATH }}
        run: |
          test -n "$VPS_BACKEND_PATH"
          install -d -m 750 "$VPS_BACKEND_PATH" "$VPS_BACKEND_PATH/scripts"
          install -m 640 docker-compose.yml docker-compose.prod.yml \
            .env.production.example "$VPS_BACKEND_PATH/"
          install -m 750 scripts/bootstrap-vps-env.sh \
            "$VPS_BACKEND_PATH/scripts/bootstrap-vps-env.sh"

      - name: Deploy immutable image and verify health
        env:
          VPS_BACKEND_PATH: ${{ secrets.VPS_BACKEND_PATH }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          TARGET_IMAGE: ${{ needs.publish.outputs.image }}
          HEALTHCHECK_URL: http://127.0.0.1:8100/health
        run: |
          set -Eeuo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
          cd "$VPS_BACKEND_PATH"

          bash scripts/bootstrap-vps-env.sh .env.production.example .env
          compose=(docker compose -f docker-compose.yml -f docker-compose.prod.yml)
          state_file=.deployed-backend-image
          previous_image=""
          if [[ -f "$state_file" ]]; then
            previous_image="$(tr -d '\r\n' < "$state_file")"
          fi

          rollback() {
            trap - ERR
            if [[ -n "$previous_image" && "$previous_image" != "$TARGET_IMAGE" ]]; then
              echo "Healthcheck en échec, retour à l'image précédente."
              BACKEND_IMAGE="$previous_image" "${compose[@]}" up -d --no-build --remove-orphans api worker shortpilot-bot
            fi
          }
          trap rollback ERR

          BACKEND_IMAGE="$TARGET_IMAGE" "${compose[@]}" pull api migrate worker shortpilot-bot
          BACKEND_IMAGE="$TARGET_IMAGE" "${compose[@]}" run --rm migrate
          BACKEND_IMAGE="$TARGET_IMAGE" "${compose[@]}" up -d --no-build --remove-orphans postgres redis api worker shortpilot-bot

          healthy=false
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --max-time 10 "$HEALTHCHECK_URL" >/dev/null; then
              healthy=true
              break
            fi
            sleep 3
          done
          [[ "$healthy" == true ]]

          printf '%s\n' "$TARGET_IMAGE" > "$state_file"
          trap - ERR
          BACKEND_IMAGE="$TARGET_IMAGE" "${compose[@]}" ps
          docker image prune -f --filter "until=168h"

# S'applique automatiquement avec `docker compose up` en développement.
services:
  postgres:
    ports: ["5432:5432"]
  redis:
    ports: ["6379:6379"]
  api:
    volumes: [".:/app"]
    command: >
      uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload
  shortpilot-bot:
    volumes:
      - .:/app
    command: >
      watchmedo auto-restart --patterns="*.py" --recursive -- python main.py

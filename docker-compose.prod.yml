# Production : `docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d`
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api
      - robot-short-yt
    networks: [internal]

volumes:
  caddy_data:
  caddy_config:

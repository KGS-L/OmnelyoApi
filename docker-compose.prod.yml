# Production : définir BACKEND_IMAGE puis lancer sans --build sur le VPS.
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD est obligatoire en production}

  redis:
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire en production}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD est obligatoire en production}

  api:
    environment:
      API_ENVIRONMENT: production
      API_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL est obligatoire en production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL est obligatoire en production}
      FRONTEND_ORIGINS: https://${APP_DOMAIN:?APP_DOMAIN est obligatoire}
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
      - /app/storage/tmp:size=1g,nosuid,nodev

  worker:
    environment:
      API_ENVIRONMENT: production
      API_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL est obligatoire en production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL est obligatoire en production}
    read_only: true
    tmpfs:
      - /tmp:size=256m,noexec,nosuid,nodev
      - /app/storage/tmp:size=2g,nosuid,nodev

  shortpilot-bot:
    environment:
      API_ENVIRONMENT: production
      API_DATABASE_URL: ${API_DATABASE_URL:?API_DATABASE_URL est obligatoire en production}
      REDIS_URL: ${REDIS_URL:?REDIS_URL est obligatoire en production}
